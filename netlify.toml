[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  included_files = ["front-end/admin.html"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/media/:splat"
  status = 200

[[redirects]]
  from = "/predications"
  to = "/front-end/predication.html"
  status = 200

[[redirects]]
  from = "/predication-detail"
  to = "/front-end/predication-detail.html"
  status = 200

[[redirects]]
  from = "/apropos"
  to = "/front-end/apropos.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/front-end/contact.html"
  status = 200

[[redirects]]
  from = "/merci"
  to = "/front-end/merci.html"
  status = 200

[[redirects]]
  from = "/admin/login"
  to = "/front-end/admin-login.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/*"
  to = "/front-end/404.html"
  status = 404
